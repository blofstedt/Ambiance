name: Release

# AND-11: this workflow is the other half of the in-app updater. It publishes a
# signed APK plus an update.json manifest to a GitHub Release; the TV reads that
# release, compares versionCode, verifies the checksum and installs.
#
# TWO THINGS MATTER AND BOTH ARE EASY TO GET WRONG:
#
#   1. Every release must be signed with the SAME key. Android refuses to
#      install an update signed by a different certificate — the user has to
#      uninstall first, losing every setting and paired sensor. Lose the
#      keystore and the update channel is finished for existing installs.
#
#   2. versionCode must only ever increase. github.run_number does that for
#      free and never resets, which is why it is used instead of anything
#      derived from the tag.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name to publish, e.g. 1.4.0'
        required: true
        type: string
      prerelease:
        description: 'Mark the release as a pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, sign and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"
          fi

          # versionName has to be a plain dotted number; Android rejects the rest.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+(\.[0-9]+){0,3}$'; then
            echo "::error::Version '$VERSION' is not a dotted numeric version like 1.4.0"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "apk_name=ambient-canvas-$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Fail early without signing material
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set. An unsigned APK cannot be installed as an update, so there is no point building one. See docs/RELEASING.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ubuntu-latest now ships Gradle >= 9.6, which AGP 8.13 cannot run under.
      # Pin the CLI used to regenerate the wrapper JAR (same as ci.yml).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # The same gates as CI. A release must never be the first place a failure
      # is discovered.
      - name: Verify
        run: npm run verify

      # BUILD-01: settings.gradle includes :capacitor-cordova-android-plugins,
      # which does not exist in a fresh clone until `cap sync` generates it.
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore Gradle wrapper
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x gradlew

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          # The keystore must never reach the workspace, where a later step
          # could package or upload it.
          test -s "$RUNNER_TEMP/release.keystore"

      - name: Assemble signed release
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.version_code }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.version }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Confirm the APK is actually signed
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::No release APK was produced"; exit 1; }

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          # An unsigned or debug-signed APK is worse than a failed build: it
          # installs once and then can never be updated.
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Stage release assets
        id: assets
        env:
          APK_NAME: ${{ steps.version.outputs.apk_name }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/$APK_NAME"

          SHA=$(sha256sum "release/$APK_NAME" | cut -d' ' -f1)
          SIZE=$(stat -c%s "release/$APK_NAME")

          # This is what the TV reads. src/lib/updates.ts parses exactly these
          # fields, and refuses the release if apkName does not match the asset.
          cat > release/update.json <<JSON
          {
            "versionCode": $VERSION_CODE,
            "versionName": "$VERSION",
            "apkName": "$APK_NAME",
            "sha256": "$SHA",
            "sizeBytes": $SIZE,
            "commit": "$GITHUB_SHA"
          }
          JSON

          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          cat release/update.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          SHA256: ${{ steps.assets.outputs.sha256 }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          TAG="v$VERSION"
          NOTES=$(cat <<NOTE
          Ambient Canvas $VERSION (build $VERSION_CODE)

          Televisions already running Ambient Canvas will offer this update on
          their own, under **Adjust Settings → Software Update**. Nothing needs
          to be sideloaded.

          SHA-256: \`$SHA256\`
          NOTE
          )

          FLAGS=""
          if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi

          # Re-running a release must not fail on an existing tag.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* \
              --title "Ambient Canvas $VERSION" \
              --notes "$NOTES" \
              $FLAGS
          fi

      - name: Summary
        run: |
          {
            echo "## Released ${{ steps.version.outputs.version }}"
            echo
            echo "- versionCode \`${{ steps.version.outputs.version_code }}\`"
            echo "- SHA-256 \`${{ steps.assets.outputs.sha256 }}\`"
            echo
            echo "Existing televisions will offer this update within a day, or"
            echo "immediately via Adjust Settings → Software Update → Check now."
          } >> "$GITHUB_STEP_SUMMARY"
