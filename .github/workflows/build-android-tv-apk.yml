name: Sideload APK

# A debug APK to copy onto a TV by hand, on demand.
#
# This used to run on every push to main and duplicated the android job in
# ci.yml step for step, so every push paid for two identical Gradle builds. CI
# now owns push validation and this workflow is manual only.
#
# It also used to pass GEMINI_API_KEY into the build. Nothing has read that key
# since BUILD-04 removed the `define` that inlined it into the client bundle,
# and passing a secret to a build that ships inside an APK is exactly the
# mistake that change existed to undo.
#
# NOTE: the debug build carries applicationIdSuffix ".debug", so it installs
# alongside the real app as a separate package. It is NOT part of the
# over-the-air update channel and will never be offered an update — that is
# release.yml's job.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or SHA to build'
        required: false
        default: ''
        type: string

concurrency:
  group: sideload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      # BUILD-01: settings.gradle includes :capacitor-cordova-android-plugins,
      # which does not exist in a fresh clone until `cap sync` generates it.
      - name: Build web bundle and sync Capacitor
        run: npm run android:prepare

      # Per android/BINARY_FREE_SETUP.md the wrapper JAR is intentionally not
      # committed, so it has to be regenerated before ./gradlew will run.
      - name: Restore Gradle wrapper
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14.3
          fi
          chmod +x gradlew

      # The manifest patching that used to live here — two sed commands
      # rewriting AndroidManifest.xml in place to inject LEANBACK_LAUNCHER and
      # the uses-feature tags — is gone. The manifest has carried all three
      # since AND-02, so the greps guarding those seds never fired, and a
      # regex that inserts markup before the first `</activity>` is not
      # something to leave armed in a build that ships to a device.
      - name: Assemble debug
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ambient-canvas-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: How to install it
        run: |
          {
            echo "## Debug APK ready"
            echo
            echo "Download the artifact above, then on a computer on the same network as the TV:"
            echo
            echo '```bash'
            echo "adb connect <tv-ip>:5555"
            echo "adb install -r app-debug.apk"
            echo '```'
            echo
            echo "Enable ADB first under Settings → Device Preferences → Developer options."
          } >> "$GITHUB_STEP_SUMMARY"
